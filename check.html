<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#c62828" />
  <title>소화기 점검</title>
  <link rel="stylesheet" href="./check.css" />
</head>
<body>
  <header class="m-header">
    <h1 id="mTitle">소화기 점검</h1>
    <div id="extInfo" class="ext-info">소화기 정보 불러오는 중…</div>
  </header>

  <main class="m-main">
    <form id="checkForm" autocomplete="off">
      <div class="card">
        <div class="card-title">점검 항목</div>
        <div id="itemList" class="item-list"></div>
      </div>

      <div class="card">
        <div class="card-title">점검자 / 비고</div>
        <div class="field">
          <label for="inspector">점검자</label>
          <input id="inspector" type="text" placeholder="이름 입력" />
        </div>
        <div class="field">
          <label for="note">비고</label>
          <textarea id="note" rows="2" placeholder="특이사항 있으면 입력"></textarea>
        </div>
      </div>

      <button type="submit" class="save-btn">✓ 점검 저장 (폰에 임시 보관)</button>
    </form>

    <div class="card queue-card">
      <div class="queue-head">
        <div class="card-title">대기 중인 점검기록</div>
        <span id="queueCount" class="queue-badge">0건</span>
      </div>
      <p class="muted">점검기록은 이 폰에 임시 저장됩니다. 순회를 마친 뒤 <b>모두 업로드</b>를 누르면 한 번에 구글 시트로 전송됩니다.</p>
      <div id="queueList" class="queue-list"></div>
      <button type="button" id="uploadBtn" class="upload-btn">⬆ 모두 업로드</button>
      <p id="uploadStatus" class="muted upload-status"></p>
    </div>
  </main>

  <div id="toast" class="toast"></div>
  <script type="module" src="./check.js"></script>
</body>
</html>
